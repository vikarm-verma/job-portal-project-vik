services:
  mysql:
    image: mysql:8.0
    container_name: jobportal-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jobportal_db}
      MYSQL_USER: ${DB_USERNAME:-jobportal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jobportal123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-root-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobportal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobportal-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-jobportal_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jobportal_db}
      DB_USERNAME: ${DB_USERNAME:-jobportal}
      DB_PASSWORD: ${DB_PASSWORD:-jobportal123}
      JWT_SECRET: ${JWT_SECRET:-dev-only-job-portal-jwt-secret-change-this-value-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: development
      DEMO_SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - jobportal

networks:
  jobportal:

volumes:
  mysql_data:
