spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jobportal_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:jobportal}
# Development fallback only. Set DB_PASSWORD outside local development.
spring.datasource.password=${DB_PASSWORD:jobportal123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Development fallback only. Set JWT_SECRET to a strong secret outside local development.
jwt.secret=${JWT_SECRET:dev-only-job-portal-jwt-secret-change-this-value-1234567890}
jwt.expiration=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.port=${SERVER_PORT:8080}
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
